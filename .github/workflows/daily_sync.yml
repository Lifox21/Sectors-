name: Daily Market Data & HMM Sync

on:
  schedule:
    # 03:45 UTC = 09:15 AM IST (Market Open Order Fills)
    # 06:00 UTC = 11:30 AM IST (Mid-Day Risk & Valuation)
    # 09:45 UTC = 03:15 PM IST (Market Close Rebalance Window)
    # 10:30 UTC = 04:00 PM IST (Post-Market Settlement & Dashboard Push)
    - cron: '45 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '45 9 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-market-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: 'Asia/Kolkata'

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Trading Bot Cycle
        run: |
          python trading_bot.py --once --no-push --force-active

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add README.md scratch/
          if git diff --cached --quiet; then
            echo "No tracked portfolio updates to commit."
          else
            git commit -m "Auto-update portfolio metrics, README dashboard, and HMM regimes [skip ci]"
            git pull --rebase origin master || true
            git push origin master
          fi

