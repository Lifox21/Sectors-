name: Daily Market Data & HMM Sync

on:
  schedule:
    # Trigger at 11:30 AM UTC (5:00 PM IST) Monday through Friday.
    - cron: '30 11 * * 1-5'
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-market-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Sync, Portfolio Rebalance, and README Update
        run: |
          python scratch/sync_portfolio_and_readme.py

      - name: Create GitHub Issue on Signal Change
        if: env.SIGNAL_CHANGE == 'true' && hashFiles('scratch/daily_signals.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "ACTION REQUIRED: HMM Portfolio Rebalance - $(date +'%Y-%m-%d')" --body-file scratch/daily_signals.md

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Indices/Daily/*.csv scratch/paper_portfolio_state.json scratch/paper_trade_log.csv README.md
          if git diff --cached --quiet; then
            echo "No tracked portfolio updates to commit."
          else
            git commit -m "Auto-update portfolio metrics, README dashboard, and HMM regimes [skip ci]"
            git push
          fi
