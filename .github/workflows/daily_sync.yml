name: Daily Market Data & HMM Sync

on:
  schedule:
    # Trigger at 11:30 AM UTC (5:00 PM IST) Monday through Friday
    - cron: '30 11 * * 1-5'
  push:
    branches: [ master ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Grants permissions to push commits back to the repo
  issues: write   # Grants permissions to create issues

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # cache pip dependencies for faster runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Sync, Portfolio Rebalance, and README Update
        run: |
          python scratch/sync_portfolio_and_readme.py

      - name: Create GitHub Issue on Signal Change
        if: env.SIGNAL_CHANGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "ACTION REQUIRED: HMM Portfolio Rebalance - $(date +'%Y-%m-%d')" --body-file scratch/daily_signals.md

      - name: Commit and Push Updates
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add Indices/Daily/*.csv scratch/paper_portfolio_state.json scratch/paper_trade_log.csv README.md
          # Check if there are changes to commit, otherwise do nothing
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update portfolio metrics, README dashboard, and HMM regimes [skip ci]" && git push)
