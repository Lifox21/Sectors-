name: Daily Market Data & HMM Sync

on:
  schedule:
    # Exact IST timings during trading hours (IST = UTC + 5:30):
    # 03:45 UTC = 09:15 AM IST (Market Open Order Execution)
    # 04:45 - 08:45 UTC = Every hour at :15 IST (10:15, 11:15, 12:15, 13:15, 14:15 IST)
    # 09:45 UTC = 03:15 PM IST (Market Close Rebalance Window)
    # 10:00 UTC = 03:30 PM IST (Market Close Bell)
    # 10:30 UTC = 04:00 PM IST (Post-Market EOD Settlement & Dashboard Push)
    - cron: '45 3 * * 1-5'
    - cron: '45 4-8 * * 1-5'
    - cron: '45 9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-market-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: 'Asia/Kolkata'

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Trading Bot Cycle
        run: |
          python trading_bot.py --once --no-push --force-active

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add README.md scratch/
          if git diff --cached --quiet; then
            echo "No tracked portfolio updates to commit."
          else
            git commit -m "Auto-update portfolio metrics, README dashboard, and HMM regimes [skip ci]"
            git pull --rebase origin master || true
            git push origin master
          fi

